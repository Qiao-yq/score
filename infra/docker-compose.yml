# 本地开发依赖：PostgreSQL + Redis + MinIO（对象存储模拟器）
# 启动：docker compose -f infra/docker-compose.yml up -d
# 注意：本机当前未安装 Docker，需先安装 Docker Desktop 后使用。
services:
  postgres:
    image: postgres:16-alpine
    container_name: task-postgres
    environment:
      POSTGRES_USER: task
      POSTGRES_PASSWORD: task
      POSTGRES_DB: task_scoring
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: task-redis
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    container_name: task-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
