name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 生成 package-lock.json 后，可将此步改为 `npm ci` 以加速且保证确定性
      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build

      # 高危漏洞集中在构建/开发工具（vitest/vite/@nestjs/cli），且修复需跨大版本升级；
      # 暂不阻断 CI，仅作为信息性报告输出，待依赖升级后恢复为阻断。
      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true
